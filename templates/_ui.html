{% macro pill(status, label=None) -%}
  <span class="pill s-{{ status }}">{{ label or status.replace('_', ' ') }}</span>
{%- endmacro %}

{# A status dropdown styled as a pill that saves as soon as it changes. #}
{% macro status_select(action, current, options, label) -%}
  <form class="inline" method="post" action="{{ action }}">
    <select name="status" class="pill-select s-{{ current }}" aria-label="{{ label }}" onchange="this.form.submit()">
      {% for s in options %}<option value="{{ s }}" {% if s == current %}selected{% endif %}>{{ s.replace('_', ' ') }}</option>{% endfor %}
    </select>
    <noscript><button class="btn btn-sm">Save</button></noscript>
  </form>
{%- endmacro %}
